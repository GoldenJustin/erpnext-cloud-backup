[project]
name = "cloud_backup"
version = "0.0.1"
authors = [{ name = "SF Group", email = "jmsengi@sfgroup.co.tz" }]
description = "Full ERPNext backup (database + apps + files) to OneDrive/SharePoint via rclone"
requires-python = ">=3.10"

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
